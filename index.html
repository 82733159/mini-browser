<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mini Browser</title>
<style>
  :root{
    --bg:#14161c; --bar:#1d2029; --line:#2c3140;
    --txt:#e8eaf0; --dim:#9aa0b4; --acc:#4f8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  #tabs{display:flex;align-items:center;gap:6px;background:#101218;
    padding:6px 8px 0;overflow-x:auto;flex-shrink:0}
  .tab{display:flex;align-items:center;gap:6px;max-width:180px;min-width:0;
    background:var(--bar);border:1px solid var(--line);border-bottom:none;
    border-radius:8px 8px 0 0;padding:8px;font-size:13px;cursor:pointer;white-space:nowrap}
  .tab.active{background:var(--bg);color:#fff}
  .tab .t{overflow:hidden;text-overflow:ellipsis;flex:1}
  .tab .x{color:var(--dim);border:none;background:none;font-size:15px;cursor:pointer;padding:0 4px}
  #newtab{background:none;border:1px dashed var(--line);color:var(--dim);
    border-radius:8px;font-size:18px;padding:4px 12px;cursor:pointer;flex-shrink:0}
  #toolbar{display:flex;gap:6px;padding:8px;background:var(--bg);
    border-bottom:1px solid var(--line);align-items:center;flex-shrink:0}
  .btn{background:var(--bar);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;font-size:16px;padding:8px 10px;cursor:pointer;min-width:44px}
  .btn:disabled{opacity:.35}
  #addr{flex:1;background:#0e1015;color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;font-size:14px;min-width:0}
  #setup{display:none;gap:6px;padding:8px;background:#2a2410;
    border-bottom:1px solid #5a4d1c;align-items:center;font-size:13px;flex-shrink:0}
  #setup.show{display:flex}
  #setup input{flex:1;background:#0e1015;color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:8px;font-size:13px;min-width:0}
  #frames{flex:1;position:relative;min-height:0}
  iframe.page{position:absolute;inset:0;width:100%;height:100%;border:0;
    background:#fff;display:none}
  iframe.page.active{display:block}
  #loading{position:absolute;top:0;left:0;right:0;height:3px;z-index:5;display:none}
  #loading.show{display:block}
  #loading div{height:100%;width:40%;background:var(--acc);border-radius:2px;
    animation:slide 1s infinite linear}
  @keyframes slide{from{margin-left:-40%}to{margin-left:100%}}
</style>
</head>
<body>
  <div id="tabs"></div>
  <div id="toolbar">
    <button class="btn" id="back" title="Back">&#8249;</button>
    <button class="btn" id="fwd" title="Forward">&#8250;</button>
    <button class="btn" id="reload" title="Reload">&#10227;</button>
    <button class="btn" id="home" title="Home">&#8962;</button>
    <input id="addr" placeholder="Search or enter address"
           autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn" id="go" title="Go">Go</button>
    <button class="btn" id="gear" title="Proxy settings">&#9881;</button>
  </div>
  <div id="setup">
    <span>Worker&nbsp;URL:</span>
    <input id="proxyInput" placeholder="https://your-worker.workers.dev"
           autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn" id="saveProxy">Save</button>
  </div>
  <div id="frames"><div id="loading"><div></div></div></div>

<script>
"use strict";
/* Mini Browser — static page, runs on GitHub Pages.
   All sites load through your Cloudflare Worker proxy (worker.js),
   which strips anti-framing headers so pages render inside the iframe. */

const HOME = "about:home";
const $ = (id) => document.getElementById(id);
const tabsEl = $("tabs"), framesEl = $("frames"), addr = $("addr");

const DEFAULT_PROXY = "https://mini-browser-proxy.3159mmg.workers.dev";
let PROXY = (localStorage.getItem("mb_proxy") || DEFAULT_PROXY).replace(/\/+$/, "");
let tabs = [], activeId = null, uid = 0;

// Called by links on the built-in home page (same-origin via srcdoc).
window.go = function (url) { navigate(url); };

function proxyFor(rawUrl) {
  return PROXY + "/?url=" + encodeURIComponent(rawUrl);
}

function hostOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); }
  catch { return url; }
}

function resolveInput(s) {
  s = (s || "").trim();
  if (!s) return null;
  if (/^about:/i.test(s)) return s;
  if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return s;          // already has a scheme
  if (/\s/.test(s) || s.indexOf(".") === -1) {           // treat as search
    return "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(s);
  }
  return "https://" + s;
}

function homeHtml() {
  const links = [
    ["Wikipedia", "https://www.wikipedia.org"],
    ["DuckDuckGo", "https://html.duckduckgo.com/html/"],
    ["Hacker News", "https://news.ycombinator.com"],
    ["Example", "https://example.com"],
    ["OpenStreetMap", "https://www.openstreetmap.org"],
    ["GitHub", "https://github.com"]
  ];
  const cards = links.map(function (l) {
    return '<a class="card" href="#" onclick="parent.go(\'' + l[1] + '\');return false">' +
           l[0] + "</a>";
  }).join("");
  return "<!DOCTYPE html><html><head><meta charset='utf-8'>" +
    "<meta name='viewport' content='width=device-width,initial-scale=1'>" +
    "<style>body{margin:0;background:#14161c;color:#e8eaf0;" +
    "font-family:system-ui,sans-serif;display:flex;flex-direction:column;" +
    "align-items:center;padding:48px 16px}h1{font-size:22px;margin:0 0 6px}" +
    "p{color:#9aa0b4;font-size:14px;margin:0 0 24px;text-align:center}" +
    ".grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));" +
    "gap:12px;width:100%;max-width:420px}" +
    ".card{background:#1d2029;border:1px solid #2c3140;border-radius:12px;" +
    "padding:18px;text-align:center;color:#e8eaf0;text-decoration:none;font-size:15px}" +
    "</style></head><body><h1>Mini Browser</h1>" +
    "<p>Pages load through your proxy worker</p>" +
    '<div class="grid">' + cards + "</div></body></html>";
}

function activeTab() {
  return tabs.find(function (t) { return t.id === activeId; }) || null;
}

function newTab(url) {
  const frame = document.createElement("iframe");
  frame.className = "page";
  frame.setAttribute("sandbox",
    "allow-scripts allow-forms allow-same-origin allow-popups allow-modals");
  frame.addEventListener("load", function () { showLoading(false); });
  framesEl.appendChild(frame);
  const tab = { id: ++uid, title: "New tab", history: [url || HOME], hi: 0, frame: frame };
  tabs.push(tab);
  switchTab(tab.id);
}

function closeTab(id) {
  const i = tabs.findIndex(function (t) { return t.id === id; });
  if (i === -1) return;
  framesEl.removeChild(tabs[i].frame);
  tabs.splice(i, 1);
  if (tabs.length === 0) { newTab(HOME); return; }
  if (id === activeId) switchTab(tabs[Math.max(0, i - 1)].id);
  else renderTabs();
}

function switchTab(id) {
  activeId = id;
  tabs.forEach(function (t) {
    t.frame.classList.toggle("active", t.id === id);
  });
  const t = activeTab();
  if (t) {
    addr.value = t.history[t.hi] === HOME ? "" : t.history[t.hi];
    // First time this tab is shown, make sure it actually loaded.
    if (!t.loaded) loadTab(t);
  }
  renderTabs();
  updateNav();
}

function loadTab(t) {
  const url = t.history[t.hi];
  if (url !== HOME && !PROXY) {
    $("setup").classList.add("show");
    $("proxyInput").value = "";
    $("proxyInput").focus();
    return;
  }
  showLoading(true);
  if (url === HOME) {
    t.frame.removeAttribute("src");
    t.frame.srcdoc = homeHtml();
  } else {
    t.frame.removeAttribute("srcdoc");
    t.frame.src = proxyFor(url);
  }
  t.loaded = true;
  t.title = url === HOME ? "Home" : hostOf(url);
  renderTabs();
  updateNav();
}

function navigate(url, push) {
  const t = activeTab();
  if (!t || !url) return;
  if (push === undefined) push = true;
  if (push) {
    t.history = t.history.slice(0, t.hi + 1);
    // Don't stack the same URL twice in a row.
    if (t.history[t.hi] !== url) {
      t.history.push(url);
      t.hi = t.history.length - 1;
    }
  }
  addr.value = url === HOME ? "" : url;
  loadTab(t);
}

function goBack() {
  const t = activeTab();
  if (t && t.hi > 0) { t.hi--; addr.value = t.history[t.hi] === HOME ? "" : t.history[t.hi]; loadTab(t); }
}

function goForward() {
  const t = activeTab();
  if (t && t.hi < t.history.length - 1) { t.hi++; addr.value = t.history[t.hi]; loadTab(t); }
}

function updateNav() {
  const t = activeTab();
  $("back").disabled = !t || t.hi <= 0;
  $("fwd").disabled = !t || !t || t.hi >= t.history.length - 1;
}

function renderTabs() {
  tabsEl.innerHTML = "";
  tabs.forEach(function (t) {
    const el = document.createElement("div");
    el.className = "tab" + (t.id === activeId ? " active" : "");
    const label = document.createElement("span");
    label.className = "t";
    label.textContent = t.title;
    const x = document.createElement("button");
    x.className = "x";
    x.textContent = "\u00d7";
    x.title = "Close tab";
    x.addEventListener("click", function (e) { e.stopPropagation(); closeTab(t.id); });
    el.appendChild(label);
    el.appendChild(x);
    el.addEventListener("click", function () { switchTab(t.id); });
    tabsEl.appendChild(el);
  });
  const plus = document.createElement("button");
  plus.id = "newtab";
  plus.textContent = "+";
  plus.title = "New tab";
  plus.addEventListener("click", function () { newTab(HOME); });
  tabsEl.appendChild(plus);
}

function showLoading(on) {
  $("loading").classList.toggle("show", !!on);
}

function goFromAddress() {
  const url = resolveInput(addr.value);
  if (url) navigate(url);
}

// ---- wiring ----
$("back").addEventListener("click", goBack);
$("fwd").addEventListener("click", goForward);
$("reload").addEventListener("click", function () {
  const t = activeTab();
  if (t) loadTab(t);
});
$("home").addEventListener("click", function () { navigate(HOME); });
$("go").addEventListener("click", goFromAddress);
addr.addEventListener("keydown", function (e) {
  if (e.key === "Enter") goFromAddress();
});
$("gear").addEventListener("click", function () {
  $("setup").classList.toggle("show");
  $("proxyInput").value = PROXY;
});
$("saveProxy").addEventListener("click", function () {
  PROXY = $("proxyInput").value.trim().replace(/\/+$/, "");
  if (!PROXY) return;
  localStorage.setItem("mb_proxy", PROXY);
  $("setup").classList.remove("show");
  const t = activeTab();
  if (t && !t.loaded) loadTab(t);
});

// ---- init ----
if (!PROXY) $("setup").classList.add("show");
newTab(HOME);
</script>
</body>
</html>
